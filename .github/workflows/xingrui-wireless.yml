name: Xingrui Wireless APK

on:
  push:
    branches:
      - build/xingrui-wireless-20261017
    paths:
      - '.ci/xingrui/**'
      - '.github/workflows/xingrui-wireless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out build payload
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned DiPlay v0.2.20
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.2.20 https://github.com/shihabal3amri/DiPlay.git "${RUNNER_TEMP}/DiPlay"
          cd "${RUNNER_TEMP}/DiPlay"
          test "$(git rev-parse HEAD)" = "3c95c936859e8a9153f0040caf2337adddb9e3e4"

      - name: Apply Xingrui E02 adaptation
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/xingrui/apply_xingrui_patch.py "${RUNNER_TEMP}/DiPlay"

      - name: Build source-only debug APK
        shell: bash
        working-directory: ${{ runner.temp }}/DiPlay
        run: |
          set -euo pipefail
          ./gradlew :mobile:assembleDebug --stacktrace

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find "${RUNNER_TEMP}/DiPlay/mobile/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${apk}"
          cp "${apk}" out/DiPlay-Xingrui-E02-Wireless-v0.2.20-debug.apk
          sha256sum out/DiPlay-Xingrui-E02-Wireless-v0.2.20-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload Xingrui APK
        uses: actions/upload-artifact@v4
        with:
          name: xingrui-wireless-apk
          path: out/*
          if-no-files-found: error
          retention-days: 7
