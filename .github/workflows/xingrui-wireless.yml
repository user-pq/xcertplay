name: Xingrui DiPlay APK

on:
  push:
    branches:
      - build/xingrui-wireless-20261017
    paths:
      - '.ci/xingrui/**'
      - '.github/workflows/xingrui-wireless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out build payload
        uses: actions/checkout@v4

      - name: Verify detached log collector
        run: |
          sh -n .ci/xingrui/collect_xingrui_test.sh
          python3 .ci/xingrui/test_collector.py

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Export Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "${ANDROID_HOME}/build-tools/36.0.0/apksigner" signing-tools/
          cp "${ANDROID_HOME}/build-tools/36.0.0/zipalign" signing-tools/
          cp "${ANDROID_HOME}/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: signing-tools/**
          if-no-files-found: error
          retention-days: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned DiPlay v0.2.20
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.2.20 https://github.com/shihabal3amri/DiPlay.git "${RUNNER_TEMP}/DiPlay"
          cd "${RUNNER_TEMP}/DiPlay"
          test "$(git rev-parse HEAD)" = "3c95c936859e8a9153f0040caf2337adddb9e3e4"

      - name: Apply Xingrui E02 adaptation
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/xingrui/apply_xingrui_patch.py "${RUNNER_TEMP}/DiPlay"
          python3 .ci/xingrui/apply_xingrui_ui_patch.py "${RUNNER_TEMP}/DiPlay"
          python3 .ci/xingrui/apply_xingrui_brand_patch.py "${RUNNER_TEMP}/DiPlay"
          python3 .ci/xingrui/apply_xingrui_product_patch.py "${RUNNER_TEMP}/DiPlay"
          python3 .ci/xingrui/apply_xingrui_wheel_learning_patch.py "${RUNNER_TEMP}/DiPlay"
          python3 .ci/xingrui/apply_xingrui_runtime_patch.py "${RUNNER_TEMP}/DiPlay"

      - name: Prepare optional standalone authentication
        shell: bash
        env:
          DIPLAY_IDENTITY_PK8_BASE64: ${{ secrets.DIPLAY_IDENTITY_PK8_BASE64 }}
          DIPLAY_CERTIFICATE_P7B_BASE64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_BASE64 }}
        run: |
          set -euo pipefail
          identity_present=false
          certificate_present=false
          [[ -n "${DIPLAY_IDENTITY_PK8_BASE64:-}" ]] && identity_present=true
          [[ -n "${DIPLAY_CERTIFICATE_P7B_BASE64:-}" ]] && certificate_present=true
          if [[ "${identity_present}" != "${certificate_present}" ]]; then
            echo 'Both MFi authentication secrets must be configured together.' >&2
            exit 1
          fi
          if [[ "${identity_present}" == true ]]; then
            auth_dir="${RUNNER_TEMP}/diplay-auth"
            mkdir -p "${auth_dir}/offline-mfi"
            printf '%s' "${DIPLAY_IDENTITY_PK8_BASE64}" | base64 --decode > "${auth_dir}/offline-mfi/identity.pk8"
            printf '%s' "${DIPLAY_CERTIFICATE_P7B_BASE64}" | base64 --decode > "${auth_dir}/offline-mfi/certificate.p7b"
            chmod 600 "${auth_dir}/offline-mfi/identity.pk8" "${auth_dir}/offline-mfi/certificate.p7b"
            test -s "${auth_dir}/offline-mfi/identity.pk8"
            test -s "${auth_dir}/offline-mfi/certificate.p7b"
            echo "DIPLAY_STANDALONE=true" >> "${GITHUB_ENV}"
            echo "DIPLAY_AUTH_ASSETS_DIR=${auth_dir}" >> "${GITHUB_ENV}"
          else
            echo "DIPLAY_STANDALONE=false" >> "${GITHUB_ENV}"
          fi

      - name: Build Xingrui APK
        shell: bash
        working-directory: ${{ runner.temp }}/DiPlay
        run: |
          set -euo pipefail
          if [[ "${DIPLAY_STANDALONE}" == true ]]; then
            ./gradlew :mobile:assembleDebug --stacktrace
          else
            ./gradlew :mobile:assembleDebug --stacktrace
          fi

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find "${RUNNER_TEMP}/DiPlay/mobile/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "${apk}"
          if [[ "${DIPLAY_STANDALONE}" == true ]]; then
            name='diplay-Xingrui-E02-v0.2.20-standalone-debug.apk'
            unzip -l "${apk}" | grep -q 'assets/offline-mfi/identity.pk8'
            unzip -l "${apk}" | grep -q 'assets/offline-mfi/certificate.p7b'
          else
            name='diplay-Xingrui-E02-v0.2.20-debug.apk'
          fi
          cp "${apk}" "out/${name}"
          cp .ci/xingrui/collect_xingrui_test.sh .ci/xingrui/collect_xingrui_test.ps1 out/
          sha256sum "out/${name}" | tee out/SHA256SUMS.txt

      - name: Remove temporary authentication files
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/diplay-auth"

      - name: Upload Xingrui APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-xingrui-apk
          path: out/*
          if-no-files-found: error
          retention-days: 7
